<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOQ Video Streaming Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .video-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-box h3 {
            margin-bottom: 15px;
            color: #00d4ff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-box h3::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00d4ff;
        }

        .video-box.received h3 {
            color: #7b2cbf;
        }

        .video-box.received h3::before {
            background: #7b2cbf;
        }

        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
            aspect-ratio: 4/3;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .stat-label {
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
        }

        .stat-value.success {
            color: #4ade80;
        }

        .stat-value.error {
            color: #f87171;
        }

        .hash-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hash-row {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .hash-row:last-child {
            margin-bottom: 0;
        }

        .hash-label {
            color: #00d4ff;
            min-width: 120px;
            font-weight: 600;
        }

        .hash-value {
            color: #ccc;
            word-break: break-all;
            flex: 1;
        }

        .hash-value.match {
            color: #4ade80;
        }

        .hash-value.mismatch {
            color: #f87171;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00d4ff, #7b2cbf);
            color: #fff;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f87171;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #4ade80;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            color: #888;
            font-size: 0.9rem;
        }

        .log-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-entry {
            padding: 4px 0;
            color: #aaa;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry.info {
            color: #00d4ff;
        }

        .log-entry.success {
            color: #4ade80;
        }

        .log-entry.error {
            color: #f87171;
        }

        .log-entry.warn {
            color: #fbbf24;
        }

        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 MOQ Video Streaming</h1>
        <p class="subtitle">Real-time Video Transmission via Media over QUIC</p>

        <div class="controls">
            <button class="btn-primary" id="startBtn" onclick="startStreaming()">
                ▶ 开始传输
            </button>
            <button class="btn-secondary" onclick="clearLogs()">
                🗑 清除日志
            </button>
        </div>

        <div class="video-container">
            <div class="video-box">
                <h3>📤 原始视频 (Source)</h3>
                <video id="sourceVideo" controls>
                    <p>Your browser does not support HTML5 video.</p>
                </video>
            </div>
            <div class="video-box received">
                <h3>📥 接收视频 (Received)</h3>
                <video id="receivedVideo" controls>
                    <p>Your browser does not support HTML5 video.</p>
                </video>
            </div>
        </div>

        <div class="stats-container" id="statsContainer" style="display: none;">
            <div class="stat-card">
                <div class="stat-label">传输状态</div>
                <div class="stat-value" id="statusValue">等待中...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">发送 Chunks</div>
                <div class="stat-value" id="sentChunks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">接收 Chunks</div>
                <div class="stat-value" id="receivedChunks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">丢包率</div>
                <div class="stat-value" id="lossRate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">传输时间</div>
                <div class="stat-value" id="duration">0.0s</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">吞吐量</div>
                <div class="stat-value" id="throughput">0 Mbps</div>
            </div>
        </div>

        <div class="hash-container" id="hashContainer" style="display: none;">
            <div class="hash-row">
                <span class="hash-label">原始视频 Hash:</span>
                <span class="hash-value" id="originalHash">-</span>
            </div>
            <div class="hash-row">
                <span class="hash-label">接收视频 Hash:</span>
                <span class="hash-value" id="receivedHash">-</span>
            </div>
            <div class="hash-row">
                <span class="hash-label">Hash 比对:</span>
                <span class="hash-value" id="hashMatch">等待传输...</span>
            </div>
        </div>

        <div class="log-container" id="logContainer">
            <div class="log-entry info">系统就绪，点击"开始传输"按钮开始测试...</div>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-indicator" id="statusIndicator"></div>
        <span class="status-text" id="statusText">未连接</span>
    </div>

    <script>
        // 模拟测试数据（实际使用时应该通过WebSocket或API从后端获取）
        let isStreaming = false;
        let logs = [];

        function addLog(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            logs.push({ message, type, time: new Date() });
        }

        function clearLogs() {
            const container = document.getElementById('logContainer');
            container.innerHTML = '<div class="log-entry info">日志已清除...</div>';
            logs = [];
        }

        function updateStats(stats) {
            document.getElementById('statsContainer').style.display = 'grid';
            document.getElementById('hashContainer').style.display = 'block';

            document.getElementById('sentChunks').textContent = stats.chunksSent || 0;
            document.getElementById('receivedChunks').textContent = stats.chunksReceived || 0;
            document.getElementById('lossRate').textContent = (stats.lossRate || 0).toFixed(2) + '%';
            document.getElementById('duration').textContent = (stats.duration || 0).toFixed(2) + 's';
            document.getElementById('throughput').textContent = (stats.throughput || 0).toFixed(2) + ' Mbps';

            const statusEl = document.getElementById('statusValue');
            if (stats.success) {
                statusEl.textContent = '✓ 成功';
                statusEl.className = 'stat-value success';
            } else if (stats.completed) {
                statusEl.textContent = '✗ 失败';
                statusEl.className = 'stat-value error';
            } else {
                statusEl.textContent = '传输中...';
                statusEl.className = 'stat-value';
            }
        }

        function updateHashInfo(info) {
            if (info.originalHash) {
                document.getElementById('originalHash').textContent = info.originalHash;
            }
            if (info.receivedHash) {
                document.getElementById('receivedHash').textContent = info.receivedHash;
            }

            const matchEl = document.getElementById('hashMatch');
            if (info.hashMatch === true) {
                matchEl.textContent = '✓ 匹配 (传输完整)';
                matchEl.className = 'hash-value match';
            } else if (info.hashMatch === false) {
                matchEl.textContent = '✗ 不匹配 (数据损坏)';
                matchEl.className = 'hash-value mismatch';
            }
        }

        function setConnectionStatus(connected) {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');

            if (connected) {
                indicator.classList.add('connected');
                text.textContent = '已连接 - MOQ Relay';
            } else {
                indicator.classList.remove('connected');
                text.textContent = '未连接';
            }
        }

        async function startStreaming() {
            if (isStreaming) return;
            isStreaming = true;

            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 传输中...';

            addLog('开始视频传输测试...', 'info');
            addLog('正在生成测试视频 (使用FFmpeg testsrc)...', 'info');

            // 模拟测试过程
            setConnectionStatus(true);

            setTimeout(() => {
                addLog('测试视频生成完成: 640x480@30fps, 5秒', 'success');
                addLog('连接到MOQ Relay (127.0.0.1:4433)...', 'info');
            }, 500);

            setTimeout(() => {
                addLog('Publisher连接成功', 'success');
                addLog('Subscriber连接成功', 'success');
                addLog('开始发布/订阅 track: video/test/real-video-stream', 'info');
            }, 1000);

            setTimeout(() => {
                addLog('开始传输视频数据 chunks...', 'info');
                // 模拟传输进度
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    if (progress <= 100) {
                        addLog(`传输进度: ${progress}%`, 'info');
                    } else {
                        clearInterval(interval);
                    }
                }, 200);
            }, 1500);

            // 模拟完成
            setTimeout(() => {
                const mockResults = {
                    chunksSent: 47,
                    chunksReceived: 47,
                    lossRate: 0.0,
                    duration: 2.345,
                    throughput: 1.28,
                    success: true,
                    completed: true,
                    originalHash: 'a1b2c3d4e5f6...' + '0'.repeat(56),
                    receivedHash: 'a1b2c3d4e5f6...' + '0'.repeat(56),
                    hashMatch: true
                };

                addLog('传输完成!', 'success');
                addLog(`发送: ${mockResults.chunksSent} chunks, 接收: ${mockResults.chunksReceived} chunks`, 'info');
                addLog(`丢包率: ${mockResults.lossRate}%, 吞吐量: ${mockResults.throughput} Mbps`, 'info');

                updateStats(mockResults);
                updateHashInfo(mockResults);

                // 设置视频源（实际项目中应该使用WebSocket或HTTP获取）
                // document.getElementById('sourceVideo').src = '/api/video/source';
                // document.getElementById('receivedVideo').src = '/api/video/received';

                isStreaming = false;
                btn.disabled = false;
                btn.textContent = '▶ 再次传输';

                addLog('测试通过: 视频传输完整且稳定!', 'success');
            }, 4000);
        }

        // 初始化
        addLog('MOQ Video Streaming Player 已加载', 'info');
        addLog('等待开始传输...', 'info');
    </script>
</body>
</html>
